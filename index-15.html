<!doctype html>
<html lang="en" data-theme="light">
<head>

  <title>ExitPrep Ethiopia</title>
  <style>
/* ExitPrep design system — navy / blue / white, with a subtle Ethiopian tricolour accent */
:root {
  --bg: #f1f7f3; --card: #ffffff; --text: #0c2418; --muted: #587566; --line: #dbe9e0;
  --brand: #0f8a46; --on-brand: #ffffff; --brand-soft: #e3f4ea; --top: #0d7a45; --navy: #0b6b3b; --navy-2: #0a4f2c;
  --good: #0f9d58; --good-soft: #e0f5e9; --bad: #d93025; --bad-soft: #fdeceb; --warn: #a86400; --warn-soft: #fff1d6;
  --eth-green: #078930; --eth-yellow: #fcdd09; --eth-red: #da121a;
  --shadow: 0 1px 2px rgba(8,40,22,.06), 0 6px 18px rgba(8,40,22,.07);
  --radius: 20px; --nav-h: 66px;
}
[data-theme="dark"] {
  --bg: #07130d; --card: #0e2217; --text: #eaf6ee; --muted: #8aa896; --line: #1b3a29;
  --brand: #2ad46f; --on-brand: #04210f; --brand-soft: #12301f; --top: #0d7a45; --navy: #0e5a37; --navy-2: #0a2d1d;
  --good: #4ade80; --good-soft: #0f2e1c; --bad: #ff7b72; --bad-soft: #35171a; --warn: #f2b632; --warn-soft: #2f2711;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Ethiopic", sans-serif; }
body { overscroll-behavior-y: none; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h2 { font-size: 20px; } h3 { font-size: 16px; }
a { color: var(--brand); }
button { font: inherit; color: inherit; cursor: pointer; }
.muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; }
.row { display: flex; align-items: center; gap: 10px; } .between { justify-content: space-between; } .wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; } .gap { display: grid; gap: 12px; }

/* layout */
.tricolor { height: 4px; background: linear-gradient(90deg, var(--eth-green) 0 33.33%, var(--eth-yellow) 33.33% 66.66%, var(--eth-red) 66.66%); }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--top); color: #fff; }
.topbar .in { display: flex; align-items: center; gap: 10px; padding: 12px 16px; max-width: 640px; margin: 0 auto; }
.topbar h1 { font-size: 18px; font-weight: 700; flex: 1; }
.topbar .iconbtn { background: rgba(255,255,255,.12); border: 0; color: #fff; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
main { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + 28px); display: grid; gap: 16px; animation: fade .25s ease; }
main.noNav { padding-bottom: 120px; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.bottomnav .in { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 640px; margin: 0 auto; }
.bottomnav a { display: grid; justify-items: center; gap: 2px; margin: 6px 3px; padding: 6px 0 5px; border-radius: 16px; font-size: 11px; font-weight: 600; color: var(--muted); text-decoration: none; }
.bottomnav a.on { color: var(--brand); background: var(--brand-soft); }
.bottomnav svg { width: 24px; height: 24px; }

/* cards + buttons */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; border: 1px solid var(--line); }
.card.flat { box-shadow: none; }
.hero { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); color: #fff; border: 0; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.07); }
.hero .muted { color: rgba(255,255,255,.75); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 14px; border: 0; font-weight: 700; background: var(--brand); color: var(--on-brand); width: 100%; transition: transform .08s, opacity .2s; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.ghost { background: var(--brand-soft); color: var(--brand); }
.btn.line { background: transparent; border: 1.5px solid var(--line); color: var(--text); }
.btn.good { background: var(--good); } .btn.bad { background: var(--bad); }
.btn.white { background: #fff; color: var(--navy); }
.btn.sm { min-height: 40px; padding: 0 14px; width: auto; border-radius: 12px; font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 600; font-size: 14px; }
.chip.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); letter-spacing: .02em; }
.badge.sample { background: var(--warn-soft); color: var(--warn); }
.badge.good { background: var(--good-soft); color: var(--good); } .badge.bad { background: var(--bad-soft); color: var(--bad); }
input[type=text], input[type=search], input[type=number], select, textarea { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
textarea { min-height: 90px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
.search { position: relative; } .search svg { position: absolute; left: 14px; top: 14px; width: 20px; height: 20px; color: var(--muted); } .search input { padding-left: 44px; }
label.f { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }

/* home */
.greet h2 { font-size: 22px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; text-align: left; box-shadow: var(--shadow); display: grid; gap: 6px; text-decoration: none; color: var(--text); align-content: start; }
.tile .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.tile .ic { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; font-size: 25px; background: var(--brand-soft); }
.tile .tag { font-size: 11px; font-weight: 800; letter-spacing: .14em; padding: 6px 12px; border-radius: 999px; background: var(--brand-soft); color: var(--muted); }
.tile.gold .ic, .tile.gold .tag { background: var(--warn-soft); } .tile.gold .tag, .tile.gold .open { color: var(--warn); }
.tile b { font-size: 18px; line-height: 1.25; } .tile .am2 { font-weight: 800; font-size: 17px; }
.tile .desc { font-size: 14px; color: var(--muted); } .tile .desc2 { font-size: 13px; color: var(--muted); }
.tile .open { color: var(--brand); font-weight: 800; margin-top: 8px; }
.pagehead { display: flex; align-items: center; gap: 10px; } .pagehead h2 { font-size: 24px; } .am { font-size: 13px; color: var(--muted); }
.iconbtn2 { flex: none; width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 22px; }
.studying { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); text-decoration: none; color: var(--text); }
.studying .ico { flex: none; width: 52px; height: 52px; border-radius: 15px; background: var(--brand-soft); display: grid; place-items: center; font-size: 27px; }
.studying h2 { font-size: 21px; } .eyebrow { font-size: 12px; letter-spacing: .12em; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.sectionlabel { font-size: 13px; letter-spacing: .16em; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-top: 6px; }
.commbtn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 64px; padding: 8px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); font-weight: 700; text-decoration: none; color: var(--text); }
.lbrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); } .lbrow:first-child { border-top: 0; }
.lbrow.me { background: var(--brand-soft); margin: 0 -10px; padding: 12px 10px; border-radius: 12px; border-top: 0; }
.rank { flex: none; width: 36px; text-align: center; font-weight: 800; font-size: 18px; }
.stat { text-align: center; } .stat b { display: block; font-size: 22px; } .stat span { font-size: 12px; color: var(--muted); }
.statrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.countdown { font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 800; letter-spacing: .02em; }
.banner-warn { background: var(--warn-soft); border-color: transparent; }

/* lists */
details.cat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
details.cat summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px; font-weight: 700; cursor: pointer; }
details.cat summary::-webkit-details-marker { display: none; }
details.cat summary .chev { margin-left: auto; transition: transform .2s; color: var(--muted); }
details.cat[open] summary .chev { transform: rotate(90deg); }
.dept { display: flex; align-items: center; gap: 10px; width: 100%; padding: 14px 16px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; }
.dept:active { background: var(--brand-soft); }
.dept .n { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.list-item:first-child { border-top: 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--brand-soft); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 11px; padding: 10px 4px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--brand); box-shadow: var(--shadow); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }

/* progress bars */
.bar { height: 10px; border-radius: 99px; background: var(--brand-soft); overflow: hidden; } .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--brand), #7ee2a8); }
.bar.low i { background: linear-gradient(90deg, var(--bad), #ff9a8f); } .bar.mid i { background: linear-gradient(90deg, #e69500, #ffc857); } .bar.high i { background: linear-gradient(90deg, var(--good), #6fe3a6); }

/* exam */
.examtop { position: sticky; top: 0; z-index: 25; background: var(--card); border-bottom: 1px solid var(--line); }
.examtop .in { max-width: 640px; margin: 0 auto; padding: 10px 16px; display: grid; gap: 8px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 800; padding: 4px 10px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.qtext { font-size: 18px; font-weight: 600; line-height: 1.45; white-space: pre-wrap; }
.choice { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); transition: border-color .15s, background .15s; }
.choice .k { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--muted); }
.choice.multi .k { border-radius: 8px; }
.choice.sel { border-color: var(--brand); background: var(--brand-soft); } .choice.sel .k { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.choice.right { border-color: var(--good); background: var(--good-soft); } .choice.right .k { background: var(--good); border-color: var(--good); color: #fff; }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); } .choice.wrong .k { background: var(--bad); border-color: var(--bad); color: #fff; }
.choice[disabled] { cursor: default; }
.feedback { border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; animation: fade .25s ease; }
.feedback.ok { background: var(--good-soft); } .feedback.no { background: var(--bad-soft); }
.feedback h3 { font-size: 17px; } .feedback .blk { background: rgba(255,255,255,.55); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; white-space: pre-wrap; }
[data-theme="dark"] .feedback .blk { background: rgba(255,255,255,.06); }
.blk .lbl { display: block; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.formula { font-family: ui-monospace, Menlo, Consolas, monospace; }
.footbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.footbar .in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; }
.navgrid button { height: 46px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-weight: 700; }
.navgrid button.ans { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.navgrid button.mk { box-shadow: inset 0 0 0 2px var(--warn); }
.navgrid button.cur { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }

/* result */
.ring { width: 148px; height: 148px; margin: 0 auto; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); } .ring .t { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring b { font-size: 34px; line-height: 1; } .ring span { font-size: 12px; color: var(--muted); }
details.rev { border-top: 1px solid var(--line); padding: 12px 0; }
details.rev summary { list-style: none; display: flex; gap: 10px; cursor: pointer; font-weight: 600; }
details.rev summary::-webkit-details-marker { display: none; }
.dot { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; color: #fff; font-weight: 800; }
.dot.ok { background: var(--good); } .dot.no { background: var(--bad); }

/* modal / toast / states */
.modal-back { position: fixed; inset: 0; z-index: 60; background: rgba(5,10,25,.55); display: grid; align-items: end; animation: fade .15s ease; }
.modal { background: var(--card); border-radius: 24px 24px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); max-width: 640px; width: 100%; margin: 0 auto; display: grid; gap: 14px; max-height: 85vh; overflow: auto; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 20px); background: var(--top); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; z-index: 80; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.splash { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 16px; background: #0a2d1d; color: #fff; }
.logo-mark { width: 64px; height: 64px; border-radius: 18px; overflow: hidden; display: grid; grid-template-rows: 1fr 1fr 1fr; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.logo-mark i:nth-child(1) { background: var(--eth-green); } .logo-mark i:nth-child(2) { background: var(--eth-yellow); } .logo-mark i:nth-child(3) { background: var(--eth-red); }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin .8s linear infinite; }
.skel { height: 90px; border-radius: var(--radius); background: linear-gradient(90deg, var(--line), var(--card), var(--line)); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes spin { to { transform: rotate(360deg); } } @keyframes sh { to { background-position: -200% 0; } }
.empty { text-align: center; padding: 28px 12px; display: grid; gap: 8px; justify-items: center; } .empty .big { font-size: 42px; }
.price { font-size: 40px; font-weight: 800; } .price small { font-size: 16px; font-weight: 600; opacity: .8; }
ul.ticks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; } ul.ticks li::before { content: "✓"; color: var(--good); font-weight: 800; margin-right: 8px; }
.notice { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 12px; border-radius: 10px; font-size: 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; } .kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-weight: 600; }
.copy { font-family: ui-monospace, Menlo, monospace; background: var(--brand-soft); padding: 2px 8px; border-radius: 8px; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.codeblk { margin: 10px 0 0; padding: 12px 14px; background: var(--brand-soft); border: 1px solid var(--line); border-radius: 12px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; overflow-x: auto; color: var(--text); }

</style>

async function api(path, { method = 'GET', body, form } = {}) {
  const headers = { 'X-Telegram-Init-Data': (tg && tg.initData) || 'dev' };   // 'dev' only works when the server runs in DEV_MODE
  let payload;
  if (body) { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
  let r;
  try { r = await fetch((window.API_URL || '') + '/api' + path, { method, headers, body: payload }); }
  catch (e) { const err = new Error('No internet connection. Please check your network and try again.'); err.offline = true; throw err; }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(data.message || (r.status === 404 ? 'Server not found. Check API_URL at the top of index.html.' : 'Request failed')); err.status = r.status; err.data = data; throw err; }
  return data;
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }
function haptic(kind) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }
function modal(html) {
  const el = document.createElement('div'); el.className = 'modal-back';
  el.innerHTML = `<div class="modal">${html}</div>`;
  el.addEventListener('click', (e) => { if (e.target === el) el.remove(); });
  document.body.appendChild(el); return el;
}
function confirmBox(title, text, okLabel, okClass = '') {
  return new Promise((resolve) => {
    const m = modal(`<h2>${esc(title)}</h2><p class="muted" style="margin:0">${text}</p><button class="btn ${okClass}" id="cb-ok">${esc(okLabel)}</button><button class="btn line" id="cb-no">Cancel</button>`);
    m.querySelector('#cb-ok').onclick = () => { m.remove(); resolve(true); };
    m.querySelector('#cb-no').onclick = () => { m.remove(); resolve(false); };
    m.addEventListener('click', (e) => { if (e.target === m) resolve(false); });
  });
}

}

  if (!tg) return;

/* ---- navigation: kept in memory so it also works where the page cannot change its own address (sandboxed previews) ---- */
let CUR = null; const STACK = [];
const getHash = () => (CUR != null ? CUR : (location.hash || '#/home'));
function go(h, replace) {
  if (!h || h[0] !== '#') h = '#/home';
  if (replace && STACK.length) STACK[STACK.length - 1] = h; else if (STACK[STACK.length - 1] !== h) STACK.push(h);
  CUR = h;
  try { history.replaceState(null, '', h); } catch (e) { try { location.hash = h; } catch (e2) {} }
  render();
}
function goBack() { if (STACK.length > 1) { STACK.pop(); CUR = STACK[STACK.length - 1]; try { history.replaceState(null, '', CUR); } catch (e) {} render(); } else { try { history.back(); } catch (e) {} } }

function searchHits(q) {
  q = q.trim().toLowerCase(); if (q.length < 2) return [];
  const out = [];
  for (const c of S.catalog.categories) for (const d of c.departments) {
    const subj = d.subjects.find((s) => s.toLowerCase().includes(q));
    if (d.name.toLowerCase().includes(q) || c.name.toLowerCase().includes(q) || subj) out.push({ d, c, subj: subj && !d.name.toLowerCase().includes(q) ? subj : '' });
  }
  return out.slice(0, 12);
}

async function dept(id) {
  shell(skeleton, { title: 'Loading…', back: true, nav: true, tab: 'learn' });
  await Promise.all([ensureCatalog(), loadMe()]);
  const data = await api(`/departments/${id}/exams?university=${S.uni}`);
  const sel = { mode: S.intent, year: null, subject: null, count: 10 };
  if (sel.mode === 'past' && data.years.length) sel.year = data.years[0].year;
  const hasSample = data.years.some((y) => y.sample);
  const yr = () => data.years.find((y) => y.year === sel.year);
  const subjectsShown = () => (sel.year ? yr().subjects : data.subjects);
  const avail = () => { if (sel.year) { const y = yr(); return sel.subject ? ((y.subjects.find((s) => s.id === sel.subject) || {}).count || 0) : y.total; } return sel.subject ? ((data.subjects.find((s) => s.id === sel.subject) || {}).count || 0) : data.total; };
  const draw = () => {
    if (sel.mode === 'past' && !sel.year && data.years.length) sel.year = data.years[0].year;
    if (sel.subject && !subjectsShown().some((s) => s.id === sel.subject)) sel.subject = null;
    const n = avail(), eff = sel.mode === 'past' ? n : Math.min(sel.count, n);
    document.getElementById('dbody').innerHTML = `
      <div class="seg" id="modeseg">${Object.entries(MODES).map(([k, v]) => `<button data-mode="${k}" class="${sel.mode === k ? 'on' : ''}">${v[0]}</button>`).join('')}</div>
      <p class="muted small" style="margin:-4px 2px 0">${MODES[sel.mode][1]}</p>
      <div class="card gap"><h3>Exam year</h3><div class="chips">${sel.mode === 'past' ? '' : `<button class="chip ${!sel.year ? 'on' : ''}" data-year="0">All years</button>`}
        ${data.years.map((y) => `<button class="chip ${sel.year === y.year ? 'on' : ''}" data-year="${y.year}">${y.year}</button>`).join('')}</div>
        ${!data.years.length ? '<p class="muted small" style="margin:0">No dated exam years are available for this department yet.</p>' : ''}
        ${sel.mode === 'past' ? '' : `<h3>Number of questions</h3><div class="chips">${[10, 20, 50, 100].map((c) => `<button class="chip ${sel.count === c ? 'on' : ''}" data-count="${c}">${c === 100 ? 'Max' : c}</button>`).join('')}</div>`}
      </div>
      ${hasSample ? '<div class="notice"><b>Sample content.</b> The questions shown here are demonstration items written for this app. They are <b>not</b> official exam papers.</div>' : ''}
      <div class="card row between"><div><b>${n} question${n === 1 ? '' : 's'} available</b><div class="muted small">${eff ? `You will get ${eff}${sel.mode === 'mock' ? ` · ${eff} minute${eff === 1 ? '' : 's'} total` : ''}` : 'Nothing published for this selection yet'}</div></div></div>
      <button class="btn" id="start" ${n ? '' : 'disabled'}>${premium() ? `Start ${MODES[sel.mode][0].toLowerCase()}` : 'Subscribe to start'}</button>
      ${data.documents.length ? `<div class="card"><h3 style="margin-bottom:6px">Past-paper PDFs</h3>${data.documents.map((d) => `<div class="list-item"><span style="font-size:22px">📕</span><div class="grow"><b>${esc(d.title)}</b><div class="muted small">${d.year || 'General'} · ${(d.size / 1048576).toFixed(1)} MB</div></div><button class="btn sm ghost" data-doc="${d.id}">Open</button></div>`).join('')}</div>` : ''}`;
    document.querySelectorAll('#dbody [data-mode]').forEach((b) => (b.onclick = () => { sel.mode = b.dataset.mode; S.intent = sel.mode; draw(); }));
    document.querySelectorAll('#dbody [data-year]').forEach((b) => (b.onclick = () => { sel.year = Number(b.dataset.year) || null; draw(); }));
    document.querySelectorAll('#dbody [data-subject]').forEach((b) => (b.onclick = () => { sel.subject = Number(b.dataset.subject) || null; draw(); }));
    document.querySelectorAll('#dbody [data-count]').forEach((b) => (b.onclick = () => { sel.count = Number(b.dataset.count); draw(); }));
    document.querySelectorAll('#dbody [data-doc]').forEach((b) => (b.onclick = async () => {
      try { const r = await api(`/documents/${b.dataset.doc}/link`); tg && tg.openLink ? tg.openLink(r.url) : window.open(r.url, '_blank'); }
      catch (e) { if (e.status === 402) { toast('Subscribe to open exam PDFs'); go('#/subscribe'); } else toast(e.message); }
    }));
    document.getElementById('start').onclick = async (ev) => {
      if (!premium()) { go('#/subscribe'); return; }
      ev.target.disabled = true;
      try { const r = await api('/attempts/start', { method: 'POST', body: { department_id: Number(id), subject_id: sel.subject, year: sel.year, university_id: S.uni, mode: sel.mode, count: sel.count } }); go('#/exam/' + r.id); }
      catch (e) { ev.target.disabled = false; if (e.status === 402) { await loadMe(); go('#/subscribe'); } toast(e.message); }
    };
  };

/* ---------- exam ---------- */
async function exam(id) {
  shell(skeleton, { nav: false, title: 'Exam' });
  const d = await api('/attempts/' + id);
  if (d.submitted) { go('#/result/' + id, true); return; }
  const st = { mode: d.mode, qs: d.questions, idx: 0, ans: {}, marks: new Set(), fb: {}, savedQ: new Set(), left: d.time_left, t0: performance.now(), chain: Promise.resolve(), saving: '' };
  Object.entries(d.answers).forEach(([qid, a]) => { st.ans[qid] = a.selected; if (a.marked) st.marks.add(+qid); if (a.feedback) st.fb[qid] = a.feedback; });
  const firstOpen = st.qs.findIndex((q) => !(st.ans[q.id] || []).length); st.idx = Math.max(0, firstOpen);
  try { tg && tg.enableClosingConfirmation && tg.enableClosingConfirmation(); } catch (e) {}
  const cur = () => st.qs[st.idx];
  const remaining = () => st.left == null ? null : st.left - Math.floor((performance.now() - st.t0) / 1000);
  const answered = () => st.qs.filter((q) => (st.ans[q.id] || []).length).length;

  const draw = () => {
    const q = cur(), sel = st.ans[q.id] || [], fb = st.fb[q.id], practice = st.mode === 'practice', multi = q.type === 'multi';
    const locked = practice && !!fb;
    const choiceHtml = q.choices.map((c, i) => {
      let k = '';
      if (fb) { const right = fb.correct_ids.includes(c.id), mine = sel.includes(c.id); k = right ? 'right' : mine ? 'wrong' : ''; } else if (sel.includes(c.id)) k = 'sel';
      return `<button class="choice ${multi ? 'multi' : ''} ${k}" data-c="${c.id}" ${locked ? 'disabled' : ''}><span class="k">${k === 'right' ? '✓' : k === 'wrong' ? '✕' : LETTERS[i]}</span><span>${esc(c.text)}</span></button>`;
    }).join('');
    let fbHtml = '';
    if (fb) {
      const wrongs = fb.choices.filter((c) => !c.is_correct);
      fbHtml = `<div class="feedback ${fb.correct ? 'ok' : 'no'}" id="fb"><h3>${fb.correct ? '✅ Correct! Well done.' : '❌ Not quite.'}</h3>
        <div class="blk"><span class="lbl">Correct answer</span>${fb.choices.filter((c) => c.is_correct).map((c) => `${LETTERS[fb.choices.indexOf(c)]}. ${esc(c.text)}`).join('<br>')}</div>
        ${fb.explanation ? `<div class="blk"><span class="lbl">Explanation</span>${esc(fb.explanation)}</div>` : ''}
        ${fb.why_wrong ? `<div class="blk"><span class="lbl">Why the other choices are wrong</span>${esc(fb.why_wrong)}</div>` : ''}
        ${fb.formula ? `<div class="blk"><span class="lbl">Formula / concept</span><span class="formula">${esc(fb.formula)}</span></div>` : ''}
        ${fb.tip ? `<div class="blk"><span class="lbl">💡 Memory tip</span>${esc(fb.tip)}</div>` : ''}
        <button class="btn sm line" data-act="q-save">${ICON.mark} ${st.savedQ.has(q.id) ? 'Saved ✓' : 'Save this question'}</button></div>`;
    }
    const last = st.idx === st.qs.length - 1;
    const needCheck = practice && multi && !fb;
    const pct = Math.round(((st.idx + (fb ? 1 : 0)) / st.qs.length) * 100);
    $app.innerHTML = `<div class="tricolor"></div>
      <header class="examtop"><div class="in"><div class="row"><button class="iconbtn" style="background:var(--brand-soft);color:var(--brand);border:0;width:38px;height:38px;border-radius:12px" data-act="q-exit" aria-label="Leave">${ICON.x}</button>
        <b class="grow">Question ${st.idx + 1} <span class="muted">/ ${st.qs.length}</span></b><span class="small muted" id="saving">${st.saving}</span>
        ${st.left != null ? `<span class="timer" id="timer">${fmtCd((remaining() || 0) * 1000)}</span>` : ''}
        <button class="iconbtn" style="background:var(--brand-soft);color:var(--brand);border:0;width:38px;height:38px;border-radius:12px" data-act="q-nav" aria-label="Question list">${ICON.grid}</button></div>
        <div class="bar"><i style="width:${pct}%"></i></div></div></header>
      <main class="noNav"><div class="card gap">
        <div class="chips">${q.topic ? `<span class="badge">${esc(q.topic)}</span>` : ''}${q.year ? `<span class="badge">${q.year}</span>` : ''}${q.source_type === 'sample' ? '<span class="badge sample">SAMPLE</span>' : ''}</div>
        <div class="qtext">${esc(q.text)}</div>${q.code ? `<pre class="codeblk">${esc(q.code)}</pre>` : ''}${multi ? '<div class="small muted">Select all that apply</div>' : ''}
        <div class="gap">${choiceHtml}</div>
        ${practice ? '' : `<button class="btn sm ${st.marks.has(q.id) ? '' : 'line'}" style="width:fit-content" data-act="q-mark">${ICON.flag} ${st.marks.has(q.id) ? 'Marked for review' : 'Mark for review'}</button>`}
      </div>${fbHtml}</main>
      <div class="footbar"><div class="in">
        <button class="btn line" style="flex:0 0 34%" data-act="q-prev" ${st.idx === 0 ? 'disabled' : ''}>‹ Previous</button>
        ${needCheck ? `<button class="btn good" data-act="q-check" ${sel.length ? '' : 'disabled'}>Check answer</button>`
          : last ? `<button class="btn good" data-act="q-submit">Finish & submit</button>` : `<button class="btn" data-act="q-next">${practice && !fb ? 'Skip' : 'Next'} ›</button>`}
      </div></div>`;
    $app.querySelectorAll('.choice').forEach((b) => (b.onclick = () => pick(Number(b.dataset.c))));
    if (fb && st.justChecked) { st.justChecked = false; document.getElementById('fb').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  };
  const setSaving = (t) => { st.saving = t; const el = document.getElementById('saving'); if (el) el.textContent = t; };
  const queueSave = (qid, selected) => {
    setSaving('Saving…');
    st.chain = st.chain.then(() => api(`/attempts/${id}/answer`, { method: 'POST', body: { question_id: qid, selected } }))
      .then(() => setSaving('Saved ✓')).catch((e) => { setSaving('⚠ Not saved'); if (e.data && e.data.error === 'time_over') autoSubmit(); else toast('Could not save — check your connection'); });
  };
  const check = async () => {
    const q = cur(), sel = st.ans[q.id];
    try { const r = await api(`/attempts/${id}/answer`, { method: 'POST', body: { question_id: q.id, selected: sel } }); st.fb[q.id] = r.feedback; st.ans[q.id] = r.selected; st.justChecked = true; haptic(r.feedback.correct ? 'success' : 'error'); draw(); }
    catch (e) { toast(e.message); }
  };
  const pick = (cid) => {
    const q = cur(); if (st.mode === 'practice' && st.fb[q.id]) return;
    let sel = st.ans[q.id] || [];
    sel = q.type === 'multi' ? (sel.includes(cid) ? sel.filter((x) => x !== cid) : [...sel, cid]) : [cid];
    st.ans[q.id] = sel;
    if (st.mode === 'practice') { draw(); if (q.type !== 'multi') check(); } else { draw(); queueSave(q.id, sel); }
  };
  const submit = async () => {
    clearTimers();
    try { await st.chain; await api(`/attempts/${id}/submit`, { method: 'POST' }); try { tg && tg.disableClosingConfirmation && tg.disableClosingConfirmation(); } catch (e) {} go('#/result/' + id, true); }
    catch (e) { toast(e.message); }
  };
  const autoSubmit = () => { toast("Time's up! Submitting your exam…"); submit(); };
  acts['q-prev'] = () => { st.idx = Math.max(0, st.idx - 1); draw(); window.scrollTo(0, 0); };
  acts['q-next'] = () => { st.idx = Math.min(st.qs.length - 1, st.idx + 1); draw(); window.scrollTo(0, 0); };
  acts['q-check'] = check;
  acts['q-mark'] = () => { const q = cur(), on = !st.marks.has(q.id); on ? st.marks.add(q.id) : st.marks.delete(q.id); draw(); st.chain = st.chain.then(() => api(`/attempts/${id}/mark`, { method: 'POST', body: { question_id: q.id, marked: on } })).catch(() => {}); };
  acts['q-save'] = async () => { try { const r = await api('/saved/' + cur().id, { method: 'POST' }); r.saved ? st.savedQ.add(cur().id) : st.savedQ.delete(cur().id); toast(r.saved ? 'Saved to your bookmarks' : 'Removed from bookmarks'); draw(); document.getElementById('fb') && document.getElementById('fb').scrollIntoView({ block: 'center' }); } catch (e) { toast(e.message); } };
  acts['q-exit'] = async () => { if (await confirmBox('Leave this exam?', 'Your answers are saved automatically. You can continue from the Home screen' + (st.left != null ? ' while the timer is still running.' : '.'), 'Leave', 'line')) { clearTimers(); try { tg && tg.disableClosingConfirmation && tg.disableClosingConfirmation(); } catch (e) {} go('#/home'); } };
  acts['q-nav'] = () => {
    const m = modal(`<div class="row between"><h2>Questions</h2><span class="muted small">${answered()}/${st.qs.length} answered</span></div>
      <div class="navgrid">${st.qs.map((q, i) => `<button class="${(st.ans[q.id] || []).length ? 'ans' : ''} ${st.marks.has(q.id) ? 'mk' : ''} ${i === st.idx ? 'cur' : ''}" data-i="${i}">${i + 1}</button>`).join('')}</div>
      <div class="small muted">Blue = answered · Orange outline = marked for review</div><button class="btn good" id="n-sub">Finish & submit</button>`);
    m.querySelectorAll('[data-i]').forEach((b) => (b.onclick = () => { st.idx = Number(b.dataset.i); m.remove(); draw(); }));
    m.querySelector('#n-sub').onclick = () => { m.remove(); acts['q-submit'](); };
  };
  acts['q-submit'] = async () => {
    const un = st.qs.length - answered();
    if (await confirmBox('Submit exam?', `${un ? `<b>${un} unanswered</b> question${un > 1 ? 's' : ''} will count as incorrect. ` : 'You answered every question. '}${st.marks.size ? `${st.marks.size} marked for review. ` : ''}You cannot change answers after submitting.`, 'Submit now', 'good')) submit();
  };
  draw();
  if (st.left != null) {
    if (remaining() <= 0) return autoSubmit();
    timers.push(setInterval(() => { const r = remaining(), t = document.getElementById('timer'); if (t) { t.textContent = fmtCd(Math.max(0, r) * 1000); t.classList.toggle('low', r <= 60); } if (r <= 0) { clearTimers(); autoSubmit(); } }, 1000));
  }
}

/* ---------- review card (used by results, saved, mistakes) ---------- */
function reviewCard(q, i, neutral) {
  const sol = (q.choices || []).map((c, k) => {
    const mine = (q.selected || []).includes(c.id);
    const cls2 = c.is_correct ? 'right' : mine ? 'wrong' : '';
    return `<div class="choice ${q.type === 'multi' ? 'multi' : ''} ${cls2}" style="cursor:default"><span class="k">${c.is_correct ? '✓' : mine ? '✕' : LETTERS[k]}</span><span>${esc(c.text)}${mine ? ' <span class="badge">Your answer</span>' : ''}</span></div>`;
  }).join('');
  return `<details class="rev"><summary><span class="dot ${neutral ? '' : q.is_correct ? 'ok' : 'no'}" ${neutral ? 'style="background:var(--brand)"' : ''}>${neutral ? '?' : q.is_correct ? '✓' : '✕'}</span><span class="grow">${i != null ? i + 1 + '. ' : ''}${esc(q.text.length > 110 ? q.text.slice(0, 110) + '…' : q.text)}</span></summary>
    <div class="gap" style="margin-top:12px"><div class="chips">${q.topic ? `<span class="badge">${esc(q.topic)}</span>` : ''}${q.source_type === 'sample' ? '<span class="badge sample">SAMPLE</span>' : ''}${q.marked ? '<span class="badge sample">Marked</span>' : ''}</div>
    <div class="qtext" style="font-size:16px">${esc(q.text)}</div>${q.code ? `<pre class="codeblk">${esc(q.code)}</pre>` : ''}${sol}
    ${q.explanation ? `<div class="feedback ok" style="background:var(--brand-soft)"><div class="blk"><span class="lbl">Explanation</span>${esc(q.explanation)}</div>${q.why_wrong ? `<div class="blk"><span class="lbl">Why the other choices are wrong</span>${esc(q.why_wrong)}</div>` : ''}${q.formula ? `<div class="blk"><span class="lbl">Formula / concept</span><span class="formula">${esc(q.formula)}</span></div>` : ''}${q.tip ? `<div class="blk"><span class="lbl">💡 Memory tip</span>${esc(q.tip)}</div>` : ''}</div>` : ''}
    <button class="btn sm line" style="width:fit-content" data-save="${q.id}">${ICON.mark} <span>${q.saved ? 'Saved ✓' : 'Save question'}</span></button></div></details>`;
}

  const msg = a.pct >= 80 ? 'Excellent work! 🌟' : a.pct >= 60 ? 'Good job — keep going! 💪' : a.pct >= 40 ? 'You are getting there. Review the explanations below.' : 'Do not give up — study the explanations and try again.';

function trendSvg(pts) {
  if (pts.length < 2) return '<p class="muted small center" style="margin:16px 0">Complete at least two exams to see your trend.</p>';
  const W = 320, H = 140, P = 22, x = (i) => P + (i * (W - 2 * P)) / (pts.length - 1), y = (v) => H - P - (v / 100) * (H - 2 * P);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.pct).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Score trend">${[0, 50, 100].map((v) => `<line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="2" y="${y(v) + 4}" font-size="10" fill="var(--muted)">${v}</text>`).join('')}
    <path d="${path}" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.pct)}" r="4.5" fill="var(--card)" stroke="var(--brand)" stroke-width="2.5"/>`).join('')}</svg>`;
}

        <ol style="padding-left:20px;margin:0;display:grid;gap:8px">${r.instructions.map((l) => `<li>${esc(l)}</li>`).join('')}</ol>
        <label class="f">Transaction ID from your receipt<input type="text" id="txn" placeholder="e.g. DK12AB34CD" autocapitalize="characters" autocomplete="off"></label>
        <label class="f">Screenshot of your receipt (JPG or PNG, up to 2 MB)<input type="file" id="rcpt" accept="image/jpeg,image/png"></label>
        <img id="rcpt-prev" alt="Receipt preview" style="display:none;max-width:100%;border-radius:12px">
        <button class="btn" id="txn-go">I have paid — submit for verification</button>
        <p class="muted small" style="margin:0">An administrator compares your screenshot with the transaction ID. Nothing is activated until the payment is approved.</p>`;
      box.querySelector('[data-copy]').onclick = (e) => { navigator.clipboard ? navigator.clipboard.writeText(e.target.dataset.copy).then(() => toast('Copied')) : toast(e.target.dataset.copy); };
      const rf = box.querySelector('#rcpt');
      rf.onchange = () => { const f = rf.files[0], img = box.querySelector('#rcpt-prev'); if (!f) { img.style.display = 'none'; return; } img.src = URL.createObjectURL(f); img.style.display = 'block'; };
      box.querySelector('#txn-go').onclick = async (e) => {
        const txn = box.querySelector('#txn').value.trim(), f = rf.files[0];
        if (!txn) return toast('Enter the transaction ID from your receipt.');
        if (!f) return toast('Upload a screenshot of your receipt.');
        if (!/^image\/(jpeg|png)$/.test(f.type) || f.size > 2 * 1024 * 1024) return toast('Use a JPG or PNG screenshot up to 2 MB.');
        e.target.disabled = true;
        try {
          const image = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('Could not read the screenshot.')); fr.readAsDataURL(f); });
          await api(`/payments/${r.payment.reference}/submit`, { method: 'POST', body: { txn_id: txn, image } });
          toast('Submitted. We will verify it shortly.'); subscribe();
        } catch (err) { e.target.disabled = false; toast(err.message); }
      };
    } catch (e) { box.innerHTML = `<div class="notice">${esc(e.message)}</div>`; }
  }));
}

        ${u.is_admin ? `<a class="btn line" style="text-decoration:none" href="#/admin">🛠 Admin dashboard</a>` : ''}
        ${S.me.support ? `<a class="btn line" style="text-decoration:none" href="https://t.me/${esc(S.me.support)}">Contact support</a>` : ''}</div>
      ${communityHtml(S.me.community)}
      <p class="muted small center">ExitPrep Ethiopia 🇪🇹 · Practice material may include clearly-labelled SAMPLE items that are not official exam papers.</p>`, { tab: 'account', title: 'Account' });
    document.getElementById('lbtoggle').onclick = async (e) => { try { const r = await api('/me/leaderboard', { method: 'POST', body: { show: !S.me.user.show_lb } }); S.me.user.show_lb = r.show_lb; e.target.textContent = r.show_lb ? 'On' : 'Off'; e.target.classList.toggle('on', r.show_lb); } catch (err) { toast(err.message); } };
    document.querySelectorAll('#themeseg button').forEach((b) => (b.onclick = () => { localStorage.setItem('theme', b.dataset.t); applyTheme(); document.querySelectorAll('#themeseg button').forEach((x) => x.classList.toggle('on', x === b)); }));

/* ---------- administrator (owner only) ---------- */
const ADMIN_TABS = { submitted: 'Waiting for review', confirmed: 'Approved', rejected: 'Rejected' };
async function admin(status = 'submitted') {
  shell(skeleton, { title: 'Admin', back: true, tab: 'account' });
  await loadMe();
  if (!S.me.user.is_admin) { shell('<div class="notice">This screen is for the administrator only.</div>', { title: 'Admin', back: true, tab: 'account' }); return; }
  const [o, { payments }] = await Promise.all([api('/admin/overview'), api('/admin/payments?status=' + status)]);
  const byId = Object.fromEntries(payments.map((x) => [x.id, x]));
  const cards = payments.map((x) => `<div class="card gap">
      <div class="row between"><div><b>${esc(x.first_name)}</b> ${x.username ? '<span class="muted small">@' + esc(x.username) + '</span>' : ''}</div><span class="badge ${PAY_STATUS[x.status][1]}">${PAY_STATUS[x.status][0]}</span></div>
      <div class="muted small">${esc(x.reference)} · ${esc(x.provider)} · ${x.amount} ${esc(x.currency)} · TXN ${esc(x.provider_txn || '—')} · ${fmtDay(x.submitted_at || x.created_at)}</div>
      ${x.reject_reason ? `<div class="small">Reason: ${esc(x.reject_reason)}</div>` : ''}
      ${x.has_receipt ? `<button class="btn sm line" data-rcpt="${x.id}" style="margin-top:8px">View receipt</button><img alt="Receipt" data-img="${x.id}" style="display:none;max-width:100%;border-radius:12px;margin-top:8px">` : '<div class="muted small">No screenshot.</div>'}
      ${status === 'submitted' ? `<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn sm good" data-approve="${x.id}">Approve</button><input type="text" placeholder="Reason if rejecting" data-reason="${x.id}" style="flex:1;min-width:140px"><button class="btn sm line" data-reject="${x.id}">Reject</button></div>` : ''}
    </div>`).join('');
  shell(`${pagehead('Admin', 'Only you can see this screen')}
    <div class="card gap"><dl class="kv"><dt>Subscribers</dt><dd>${o.subscribers}</dd><dt>In free trial</dt><dd>${o.trial}</dd><dt>Waiting for review</dt><dd>${o.pending}</dd><dt>Approved payments</dt><dd>${o.paid} · ${o.revenue} ETB</dd></dl></div>
    <div class="seg gap" id="admseg">${Object.entries(ADMIN_TABS).map(([k, v]) => `<button data-s="${k}" class="${k === status ? 'on' : ''}">${v}</button>`).join('')}</div>
    ${cards || '<div class="card muted">Nothing here.</div>'}`, { title: 'Admin', back: true, tab: 'account' });
  document.querySelectorAll('#admseg button').forEach((b) => (b.onclick = () => admin(b.dataset.s)));
  document.querySelectorAll('[data-rcpt]').forEach((b) => (b.onclick = async () => {
    const id = b.dataset.rcpt, img = document.querySelector(`[data-img="${id}"]`);
    b.disabled = true;
    try { img.src = (await api('/admin/receipt/' + id)).image; img.style.display = 'block'; b.remove(); }
    catch (err) { b.disabled = false; toast(err.message); }
  }));
  document.querySelectorAll('[data-approve]').forEach((b) => (b.onclick = async () => {
    const x = byId[b.dataset.approve];
    if (!await confirmBox('Approve this payment?', `${esc(x.first_name)} pays ${x.amount} ${esc(x.currency)} for ${S.me.price.days} days of premium.`, 'Approve', 'good')) return;
    try { await api(`/admin/payments/${x.id}/approve`, { method: 'POST' }); toast('Approved. The student has been told.'); admin(status); }
    catch (err) { toast(err.message); }
  }));
  document.querySelectorAll('[data-reject]').forEach((b) => (b.onclick = async () => {
    const id = b.dataset.reject, reason = document.querySelector(`[data-reason="${id}"]`).value.trim();
    try { await api(`/admin/payments/${id}/reject`, { method: 'POST', body: { reason } }); toast('Rejected. The student has been told.'); admin(status); }
    catch (err) { toast(err.message); }
  }));
}

/* ============ 4. actions, router, boot ============ */
const acts = {
  back: () => goBack(),
  theme: (el, ev) => { ev && ev.stopPropagation(); const cur = document.documentElement.dataset.theme; localStorage.setItem('theme', cur === 'dark' ? 'light' : 'dark'); applyTheme(); document.querySelectorAll('.iconbtn2').forEach((b) => (b.textContent = themeEmoji())); },
  trial: async () => {
    if (!(await confirmBox('Start your free trial?', 'You get 48 hours of full access starting now. The countdown cannot be paused or restarted.', 'Start 48-hour trial'))) return;
    try { await api('/trial/start', { method: 'POST' }); await loadMe(); toast('Trial started — enjoy! 🎉'); haptic('success'); render(); } catch (e) { toast(e.message); }
  },
  tobot: () => { if (tg && tg.close) tg.close(); else location.href = 'https://t.me/' + S.me.bot; },
};
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]'); if (a && acts[a.dataset.act]) { e.preventDefault(); acts[a.dataset.act](a, e); return; }
  const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const l = e.target.closest('a[href^="#"]'); if (l) { e.preventDefault(); go(l.getAttribute('href')); }
});
// live countdowns (display only; the server enforces access)
setInterval(() => {
  document.querySelectorAll('[data-cd]').forEach((el) => {
    const left = Number(el.dataset.cd) - now(); el.textContent = fmtCd(left);
    if (left <= 0 && !el.dataset.done) { el.dataset.done = 1; loadMe().then(render).catch(() => {}); }
  });
}, 1000);

const routes = [[/^#\/home$/, home], [/^#\/learn$/, learn], [/^#\/dept\/(\d+)$/, dept], [/^#\/exam\/(\d+)$/, exam], [/^#\/result\/(\d+)$/, result], [/^#\/progress$/, progress], [/^#\/faq$/, faq], [/^#\/compete$/, compete],
  [/^#\/saved$/, () => reviewList('saved')], [/^#\/mistakes$/, () => reviewList('mistakes')], [/^#\/subscribe$/, subscribe], [/^#\/account$/, account], [/^#\/admin$/, admin]];
async function render() {
  clearTimers(); syncBack();
  document.querySelectorAll('.modal-back').forEach((m) => m.remove());
  const h = getHash();
  for (const [re, fn] of routes) {
    const m = h.match(re);
    if (m) {
      try { await fn(...m.slice(1)); }
      catch (e) { if (e.data && e.data.error === 'telegram_required') return openInTelegram(); showError(e); }
      return;
    }
  }
  go('#/home', true);
}
window.addEventListener('hashchange', () => { if ((location.hash || '#/home') !== getHash()) { CUR = location.hash || '#/home'; STACK.push(CUR); render(); } });

(async function boot() {
  setupTelegram(); applyTheme();
  try { await loadMe(); }
  catch (e) { if (e.data && e.data.error === 'telegram_required') return openInTelegram(); return showError(e, () => location.reload()); }
  go(location.hash && /^#\//.test(location.hash) ? location.hash : '#/home', true);
})();
})();

</script>
